[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazda-sdk"
version = "0.1.0"
description = "Python SDK for Mazda 6e & CX-6e (Changan CMA gateway) vehicle telemetry and API"
authors = [
    { name = "David Barreiro", email = "dbarreiro@example.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
ha = [
    "homeassistant>=2026.8.0",
]

[tool.setuptools.packages.find]
include = ["mazda*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
