name: Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install the SDK with its test and Home Assistant dependencies
        run: |
          for sdk in deepal_sdk mazda_sdk; do
            if [ -d "$sdk" ]; then
              pip install -e "$sdk[dev,ha]"
            fi
          done

      - name: Compile every Python file
        run: |
          for path in custom_components deepal_sdk mazda_sdk; do
            if [ -d "$path" ]; then
              python -m compileall -q "$path"
            fi
          done

      - name: Validate every JSON file
        run: |
          python - <<'EOF'
          import json
          from pathlib import Path

          for path in Path("custom_components").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          json.loads(Path("hacs.json").read_text(encoding="utf-8"))
          print("JSON OK")
          EOF

      - name: Run the test suites
        run: |
          for sdk in deepal_sdk mazda_sdk; do
            if [ -d "$sdk/tests" ]; then
              pytest "$sdk/tests" -q
            fi
          done
